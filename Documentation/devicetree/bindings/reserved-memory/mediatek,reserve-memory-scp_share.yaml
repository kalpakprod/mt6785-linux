%YAML 1.2
---
$id: http://devicetree.org/schemas/reserved-memory/mediatek,reserve-memory-scp_share.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek SCP shared DRAM

maintainers:
  - Pi phone port <worker@poco.local>

description: |
  DRAM the System Companion Processor (SCP) and the AP share: the SCP firmware
  keeps its sensor hub event FIFO and its log ring here, and the AP side of the
  hub driver maps the same bytes.  The region is found by its compatible
  (mediatek,reserve-memory-scp_share, the SoC node's scp_mem_key), and the
  driver splits it into the fixed blocks the firmware's scp_mem_tbl describes.

  It is a dynamic reserved-memory node (size, alignment and alloc-ranges, no
  reg): the address is chosen by the boot or by the kernel's reserved-memory
  allocator, so the node can never overlap one of the bootloader's own
  reservations.

allOf:
  - $ref: reserved-memory.yaml

properties:
  compatible:
    const: mediatek,reserve-memory-scp_share

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    reserved-memory {
        #address-cells = <2>;
        #size-cells = <2>;

        scp-share {
            compatible = "mediatek,reserve-memory-scp_share";
            no-map;
            size = <0x00 0x400000>;
            alignment = <0x00 0x1000000>;
            alloc-ranges = <0x00 0x40000000 0x00 0x50000000>;
        };
    };
