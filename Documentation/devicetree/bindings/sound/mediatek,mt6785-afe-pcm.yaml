%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt6785-afe-pcm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6785 audio front end

maintainers:
  - MediaTek SoC Team <linux-mediatek@lists.infradead.org>

description: |
  The audio front end of the MT6785 moves PCM between memory (through its
  memory interfaces) and the codec, the I2S ports and the PCM/TDM interfaces.
  It is a child of the SoC's audio system controller, which is the syscon its
  register map comes from, so it carries no reg of its own.

properties:
  compatible:
    const: mediatek,mt6785-audio

  interrupts:
    maxItems: 1

  resets:
    maxItems: 1

  reset-names:
    const: audiosys

  mediatek,apmixedsys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The APMIXEDSYS controller, where the audio PLLs live.

  mediatek,infracfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The infrastructure clock controller.

  mediatek,topckgen:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The top clock generator, where the audio muxes live.

  power-domains:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

  clocks: true
  clock-names: true

  pinctrl-names: true

patternProperties:
  # the MTKAIF pin states the driver looks up by name (mt6785-afe-gpio.c)
  '^pinctrl-[0-9]+$': true

required:
  - compatible
  - interrupts
  - resets
  - reset-names
  - mediatek,apmixedsys
  - mediatek,infracfg
  - mediatek,topckgen
  - power-domains
  - "#sound-dai-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    audsys: syscon@11210000 {
        compatible = "mediatek,mt6785-audsys", "syscon";
        reg = <0x11210000 0x1000>;
        #clock-cells = <1>;

        audio-controller {
            compatible = "mediatek,mt6785-audio";
            interrupts = <GIC_SPI 184 IRQ_TYPE_LEVEL_LOW>;
            resets = <&watchdog 17>;
            reset-names = "audiosys";
            mediatek,apmixedsys = <&apmixedsys>;
            mediatek,infracfg = <&infracfg>;
            mediatek,topckgen = <&topckgen>;
            power-domains = <&spm 0>;
            #sound-dai-cells = <0>;
        };
    };

    watchdog: watchdog@10007000 {
        reg = <0x10007000 0x100>;
        #reset-cells = <1>;
    };

    apmixedsys: clock-controller@1000c000 {
        reg = <0x1000c000 0x1000>;
        #clock-cells = <1>;
    };

    infracfg: clock-controller@10001000 {
        reg = <0x10001000 0x1000>;
        #clock-cells = <1>;
    };

    topckgen: clock-controller@10000000 {
        reg = <0x10000000 0x1000>;
        #clock-cells = <1>;
    };

    spm: power-controller@10006000 {
        reg = <0x10006000 0x1000>;
        #power-domain-cells = <1>;
    };

...
