%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/awinic,aw87xxx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW87xxx smart speaker amplifier

maintainers:
  - MediaTek SoC Team <linux-mediatek@lists.infradead.org>

description: |
  The AW87xxx family (AW87339, AW87359, AW87369, AW87519, AW87559) are Class-D
  speaker amplifiers that take their audio in analog from the codec and are
  programmed over I2C with a per-scene register profile. The part on the bus is
  detected by reading register 0x00, and the profile file name carries the
  detected id and the amplifier's channel, so a board with two of them needs
  only the channel number here.

  The amplifier is a sink in the sound card's DAPM graph: the machine driver
  routes the codec's output into the "Amp" widget this driver registers, and
  that widget's power events load the music scene on power up and the off scene
  on power down. sound-name-prefix makes the widget name unique on boards with
  more than one amplifier.

properties:
  compatible:
    const: awinic,aw87xxx

  reg:
    maxItems: 1

  reset-gpios:
    description: The part's reset pin, active low, when the board wires one.

  awinic,pa-channel:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      The amplifier's channel number, which the firmware profile file name
      carries (aw87xxx_pid_<id>_<scene>_<channel>.bin).
    enum: [0, 1]

  sound-name-prefix:
    $ref: /schemas/types.yaml#/definitions/string
    description: Prefix for the DAPM widget name, so two amplifiers differ.

required:
  - compatible
  - reg
  - awinic,pa-channel

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    pio: pinctrl {
        gpio-controller;
        #gpio-cells = <2>;
    };

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        speaker@58 {
            compatible = "awinic,aw87xxx";
            reg = <0x58>;
            awinic,pa-channel = <1>;
            sound-name-prefix = "Spk";
        };

        earpiece@5b {
            compatible = "awinic,aw87xxx";
            reg = <0x5b>;
            reset-gpios = <&pio 24 GPIO_ACTIVE_LOW>;
            awinic,pa-channel = <0>;
            sound-name-prefix = "Rcv";
        };
    };

...
