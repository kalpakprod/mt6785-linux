%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt6359-accdet.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6359 accessory detection (ACCDET)

maintainers:
  - MediaTek SoC Team <linux-mediatek@lists.infradead.org>

description: |
  The accessory detection block of the MT6359 PMIC: it sees the headset being
  plugged in and out, tells a headphone from a headset with a microphone, and
  measures the headset's buttons. It is an MFD child of the PMIC node, which
  provides its interrupts; nothing here is on an AP bus.

properties:
  compatible:
    const: mediatek,mt6359-accdet

  mediatek,mic-vol:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Microphone bias voltage code.
    maximum: 15

  mediatek,mic-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Microphone bias mode: 1 for the standard bias, 2 for the low-cost mode
      with the internal resistor.

  mediatek,plugout-debounce:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Plug-out debounce setting.

  mediatek,pwm-deb-setting:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 15
    maxItems: 15
    description: |
      The fifteen debounce words of the block: the auxiliary-ADC debounce, the
      end-of-debounce value, the PWM widths and the button thresholds' timing.

  mediatek,eint-level-pol:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Level polarity of the detection interrupt.

  mediatek,eint-use-ap:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: |
      0 routes the detection interrupt through the PMIC (the picture on this
      board), 1 through a GPIO of the SoC.

  mediatek,eint-detect-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Detection mode; 4 is the hardware mode.

  mediatek,eint-num:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2]
    description: Which PMIC EINT line carries the detection - 0, 1 or both.

  mediatek,eint-trig-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: Trigger through the GPIO block (0) or through the inverter (1).

  mediatek,eint-use-ext-res:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: Use the external (1) or the internal (0) reference resistor.

  mediatek,eint-comp-vth:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Comparator threshold of the detection.

  mediatek,key-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2]
    description: |
      Headset button arrangement: 0 for three buttons, 1 for four, 2 for the
      three-button CDD thresholds.

  mediatek,three-key-thr:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4
    description: The four thresholds of a three-button headset, ending with the open value.

  mediatek,four-key-thr:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 5
    maxItems: 5
    description: The five thresholds of a four-button headset, ending with the open value.

  mediatek,tri-key-cdd-thr:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4
    description: The three-button CDD thresholds.

additionalProperties: false

examples:
  - |
    pmic {
        accdet {
            compatible = "mediatek,mt6359-accdet";

            mediatek,mic-vol = <8>;
            mediatek,mic-mode = <2>;
            mediatek,plugout-debounce = <1>;
            mediatek,eint-use-ap = <0>;
            mediatek,eint-detect-mode = <4>;
            mediatek,key-mode = <0>;
            mediatek,three-key-thr = <0 80 220 400>;
        };
    };

...
