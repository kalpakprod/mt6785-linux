%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/mediatek,mt6785-scp-cm4.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Mediatek MT6785 System Companion Processor (Cortex-M4)

maintainers:
  - Pi phone port <worker@poco.local>

description:
  The MT6785 SCP is a Cortex-M4 that runs the tinysys "CM4" firmware, which
  drives the motion and environment sensors on its own I2C buses.  Unlike the
  RISC-V SCP of later SoCs it has no mailbox pins and no virtio; the IPI and the
  ready handshake go through share objects in its SRAM.

  The firmware is loaded by the bootloader, not by Linux.  The bootloader reads
  this node (compatible "mediatek,scp" and its status) and the properties
  documented below as "read by the bootloader", reserves the image carriage-out
  and fills the region info in SCP SRAM.  Linux reads that back and releases
  the core.

properties:
  compatible:
    items:
      - const: mediatek,mt6785-scp
      - const: mediatek,scp
        description: matched by the bootloader, which then loads the firmware.

  reg:
    items:
      - description: SCP SRAM (the TCM the firmware runs from)
      - description: SCP configuration registers
      - description: SCP clock control registers
      - description: SCP L1 cache control registers

  reg-names:
    items:
      - const: sram
      - const: cfg
      - const: clkctrl
      - const: l1cctrl

  clocks:
    items:
      - description: SCP clock (the top mux feeding the core)
      - description: SCP bus gate

  clock-names:
    items:
      - const: main
      - const: infra

  interrupts:
    maxItems: 1
    description: SCP-to-AP interrupt, used for the ready handshake and IPI.

  memory-region:
    maxItems: 1
    description:
      The DRAM block the firmware and the AP share (the sensor hub's FIFO and
      the logger).  When it is absent the driver looks the reservation up by
      its compatible, "mediatek,reserve-memory-scp_share".

  mediatek,infracfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the infracfg syscon, whose IRQ-set register carries the AP
      awake lock the AP takes before it touches the SCP's mailbox SRAM.

  core_1:
    $ref: /schemas/types.yaml#/definitions/string
    description: read by the bootloader; "enable" starts the second core.

  scp_sramSize:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: read by the bootloader; size of the SCP SRAM in bytes.

  scp_mpuRegionId:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: read by the bootloader; the EMI MPU region the SCP may use.

  scp_feature_tbl:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      read by the bootloader; pairs of feature id and the frequency in MHz it
      needs.

  scp_mem_key:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      read by the bootloader; compatible of the reserved-memory node that
      holds the shared DRAM blocks.

  scp_mem_tbl:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      read by the bootloader; pairs of DRAM block id (in the order of the
      firmware's block table) and its size in bytes.

required:
  - compatible
  - reg
  - reg-names
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/clock/mediatek,mt6785-clk.h>

    scp@10500000 {
        compatible = "mediatek,mt6785-scp", "mediatek,scp";
        reg = <0x10500000 0xc0000>,
              <0x105c0000 0x3000>,
              <0x105c4000 0x1000>,
              <0x105d4000 0x6000>;
        reg-names = "sram", "cfg", "clkctrl", "l1cctrl";
        interrupts = <GIC_SPI 201 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&topckgen CLK_TOP_SCP>, <&infracfg CLK_INFRA_SCP>;
        clock-names = "main", "infra";
        mediatek,infracfg = <&infracfg>;
        core_1 = "enable";
        scp_sramSize = <0xc0000>;
        scp_mpuRegionId = <0x07>;
        scp_feature_tbl = <0x00 0x05 0x01 0x164 0x02 0x3e>;
        scp_mem_key = "mediatek,reserve-memory-scp_share";
        scp_mem_tbl = <0x00 0x49200 0x01 0x100000 0x04 0x180000>;
        status = "okay";
    };
