%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt6785-seninf.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6785 SENINF CSI-2 receiver

maintainers:
  - devicetree@vger.kernel.org

description: |
  SENINF is the CSI-2 receiver and routing block of the MediaTek camera front
  end: it receives CSI-2 from the sensors, applies the per-receiver mux and
  routes the result through a global cam mux either to the closed image signal
  processor or to a CAMSV capture engine.

  On MT6785 the digital block starts at 0x1a040000 and holds one 0x1000 block
  per receiver, plus the top registers at the base itself; the analog receiver
  block starts at 0x11c80000 and is 0xc000 long. Both windows are in the live
  device tree of the Poco M5s (seninf1_csi2@1a040000, mipi_rx_ana_csi0a@11c80000)
  and in the vendor SENINF_MAP_BASE_REG/LENGTH_REG and
  SENINF_MAP_BASE_ANA/LENGTH_ANA constants.

properties:
  compatible:
    enum:
      - mediatek,mt6785-seninf

  reg:
    items:
      - description: digital registers
      - description: analog receiver registers

  reg-names:
    items:
      - const: seninf
      - const: ana

  clocks:
    maxItems: 1
    description: The SENINF gate, CLK_CAM_SENINF.

  clock-names:
    items:
      - const: seninf

  power-domains:
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    patternProperties:
      '^port@[0-4]$':
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: Input from a sensor on the CSI port of the same number.

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes: true
              bus-type:
                enum:
                  - 1 # MIPI CSI-2 C-PHY
                  - 4 # MIPI CSI-2 D-PHY

      '^port@[5-9]$':
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: Output to a capture engine, one port per cam mux.

        properties:
          endpoint:
            $ref: /schemas/graph.yaml#/$defs/endpoint-base

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt6785-clk.h>
    #include <dt-bindings/power/mediatek,mt6785-power.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        seninf: seninf@1a040000 {
            compatible = "mediatek,mt6785-seninf";
            reg = <0 0x1a040000 0 0xa000>,
                  <0 0x11c80000 0 0xc000>;
            reg-names = "seninf", "ana";
            clocks = <&camsys CLK_CAM_SENINF>;
            clock-names = "seninf";
            power-domains = <&spm MT6785_POWER_DOMAIN_CAM>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    endpoint {
                        remote-endpoint = <&sensor_out>;
                        data-lanes = <1 2 3 4>;
                    };
                };

                port@5 {
                    reg = <5>;

                    endpoint {
                        remote-endpoint = <&camsv_in>;
                    };
                };
            };
        };
    };
...
