%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/galaxycore,gc02m1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaxyCore GC02M1 2 megapixel image sensor

maintainers:
  - devicetree@vger.kernel.org

description: |
  The GC02M1 is a 2 megapixel CMOS image sensor with a single-lane MIPI CSI-2
  output. The Poco M5s fits it as its macro camera, and the same board can
  carry the OV02B1B instead as the depth camera, so a board describes
  whichever part it has.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: galaxycore,gc02m1

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: External clock (XCLK) of the sensor.

  avdd-supply:
    description: Analog power supply.

  dvdd-supply:
    description: Digital core power supply.

  dovdd-supply:
    description: I/O power supply.

  reset-gpios:
    maxItems: 1
    description: Active-low reset line.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1

        required:
          - data-lanes

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@37 {
            compatible = "galaxycore,gc02m1";
            reg = <0x37>;

            clocks = <&topckgen 78>;
            clock-names = "xclk";
            assigned-clock-rates = <24000000>;

            avdd-supply = <&cam_avdd1>;
            dvdd-supply = <&cam_dvdd1>;
            dovdd-supply = <&mt6359_vcamio_ldo_reg>;

            reset-gpios = <&pio 119 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    data-lanes = <1>;
                    remote-endpoint = <&seninf_macro_in>;
                };
            };
        };
    };
...
