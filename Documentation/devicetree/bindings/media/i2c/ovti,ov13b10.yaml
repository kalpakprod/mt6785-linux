%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov13b10.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Omnivision OV13B10 CMOS sensor

maintainers:
  - poco-display-worker <worker@poco.local>

description: |
  The OV13B10 is a 13 megapixel 4-lane MIPI CSI-2 sensor. The driver takes three supplies,
  one memory clock and one reset line, and the endpoint describes the four data lanes and the
  link frequency the sensor is configured for.

properties:
  compatible:
    const: ovti,ov13b10

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  avdd-supply:
    description: Analog power supply (2.8 V on the boards seen so far).

  dvdd-supply:
    description: Digital core power supply (1.2 V).

  dovdd-supply:
    description: Digital I/O power supply (1.8 V).

  reset-gpios:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            oneOf:
              - items:
                  - const: 1
                  - const: 2
                  - const: 3
                  - const: 4
          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@36 {
            compatible = "ovti,ov13b10";
            reg = <0x36>;

            clocks = <&cam_clk>;

            avdd-supply = <&avdd>;
            dvdd-supply = <&dvdd>;
            dovdd-supply = <&dovdd>;
            reset-gpios = <&pio 124 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    link-frequencies = /bits/ 64 <560000000>;
                    data-lanes = <1 2 3 4>;
                };
            };
        };
    };
...
