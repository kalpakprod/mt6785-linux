%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/willsemi,wl2866d.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Wingtech/Will Semiconductor WL2866D camera LDO controller

maintainers:
  - devicetree@vger.kernel.org

description: |
  The WL2866D is a four-channel I2C low dropout regulator used on camera
  sensor modules. Two outputs (DVDD) span 0.6 V to 2.13 V in 6 mV steps with
  a 650 mA rating, two outputs (AVDD) span 1.2 V to 4.3875 V in 12.5 mV
  steps, and each output has its own enable bit in the shared enable
  register. One GPIO enables the whole part.

properties:
  compatible:
    enum:
      - willsemi,wl2866d

  reg:
    maxItems: 1

  vin-supply: true

  enable-gpios:
    maxItems: 1
    description:
      GPIO that enables the part. The pin is asserted (driven to its active
      level) while the chip is addressed, so describe it as active low when
      the board pulls the line low to power the part up.

  regulators:
    type: object
    description:
      Two DVDD and two AVDD outputs, named dvdd1, dvdd2, avdd1 and avdd2.

    patternProperties:
      "^dvdd[12]$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false
        description:
          DVDD output, 600000 uV to 2130000 uV.

      "^avdd[12]$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false
        description:
          AVDD output, 1200000 uV to 4387500 uV.

    additionalProperties: false

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera_ldo: regulator@28 {
            compatible = "willsemi,wl2866d";
            reg = <0x28>;
            enable-gpios = <&pio 195 GPIO_ACTIVE_LOW>;

            regulators {
                dvdd1 {
                    regulator-name = "wl2866d_dvdd1";
                    regulator-min-microvolt = <600000>;
                    regulator-max-microvolt = <2130000>;
                };

                dvdd2 {
                    regulator-name = "wl2866d_dvdd2";
                    regulator-min-microvolt = <600000>;
                    regulator-max-microvolt = <2130000>;
                };

                avdd1 {
                    regulator-name = "wl2866d_avdd1";
                    regulator-min-microvolt = <1200000>;
                    regulator-max-microvolt = <4387500>;
                };

                avdd2 {
                    regulator-name = "wl2866d_avdd2";
                    regulator-min-microvolt = <1200000>;
                    regulator-max-microvolt = <4387500>;
                };
            };
        };
    };
...
