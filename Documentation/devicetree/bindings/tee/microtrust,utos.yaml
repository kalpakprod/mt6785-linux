%YAML 1.2
---
$id: http://devicetree.org/schemas/tee/microtrust,utos.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microtrust SOTER / iSee secure world notification interrupts

maintainers:
  - Poco M5s Linux port <noreply@example.invalid>

description: |
  Microtrust's SOTER (iSee) secure OS runs on some MediaTek SoCs next to the
  normal world and signals it over dedicated, edge-triggered GIC interrupts.
  The node has no register range: the secure world owns every register it
  needs, and the normal world only registers a handler for the notification
  lines so that the Microtrust client driver can be told about user-TA events.

  The interrupt numbers are board specific. On the POCO M5s (MT6785) they are
  GIC_SPI 91 and 92, the same two lines the vendor SoC description of this chip
  declares ("Microtrust SW IRQ number 91(123) ~ 95(127)" in the vendor
  mt6785.dts).

properties:
  compatible:
    const: microtrust,utos

  interrupts:
    minItems: 2
    maxItems: 2
    description: |
      The notification lines of the secure world, edge triggered on the rising
      edge. The Microtrust client driver registers a handler on the first one;
      the second carries the additional user-TA notification the platform
      declares.

required:
  - compatible
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    utos {
      compatible = "microtrust,utos";
      interrupts = <GIC_SPI 91 IRQ_TYPE_EDGE_RISING>,
                   <GIC_SPI 92 IRQ_TYPE_EDGE_RISING>;
    };

...
