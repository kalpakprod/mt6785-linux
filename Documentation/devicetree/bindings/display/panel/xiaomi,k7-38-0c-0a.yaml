%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/xiaomi,k7-38-0c-0a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi K7 38-0c-0a 6.7" 1080x2400 AMOLED MIPI-DSI panel

maintainers:
  - Poco M5s Linux port <noreply@example.invalid>

description: |
  The Xiaomi "k7 38 0c 0a" is a 6.7 inch 1080x2400 AMOLED module, 67 x 149 mm,
  driven by a FocalTech FT3418-class display driver IC and used in the POCO M5s
  and the Redmi Note 10S. It is a video mode panel with sync pulses, four DSI
  lanes and RGB888, and takes its brightness over DCS 0x51 (11 bits): there is
  no backlight LED string and no PWM input.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: xiaomi,k7-38-0c-0a

  reg:
    maxItems: 1

  vddi-supply:
    description: 1.8 V I/O supply rail (VDDI)

  vdd-supply:
    description: 3.0 V analogue supply rail (AVDD and ELVDD)

  reset-gpios: true
  port: true

required:
  - compatible
  - reg
  - vddi-supply
  - vdd-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "xiaomi,k7-38-0c-0a";
            reg = <0>;
            vddi-supply = <&panel_vddi>;
            vdd-supply = <&panel_avdd>;
            reset-gpios = <&pio 44 GPIO_ACTIVE_LOW>;
            backlight = <&backlight>;

            port {
                endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };
...
