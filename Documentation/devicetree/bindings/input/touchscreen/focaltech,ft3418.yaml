%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/focaltech,ft3418.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FocalTech FT3418 incell AMOLED touchscreen controller

maintainers:
  - Poco M5s Linux port <noreply@example.invalid>

description: |
  The FT3418 is a FocalTech incell touch controller that sits behind AMOLED
  panels, for example the Xiaomi "k7 38 0c 0a" of the POCO M5s and the Redmi
  Note 10S. It answers on I2C with chip id 0x54/0x52 and reports up to ten
  contact points through its 63 byte frame; it is not an FT5x06-family part.

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: focaltech,ft3418

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: active low reset line

  vdd-supply:
    description: 3.0 V analogue supply rail

  iovdd-supply:
    description: 1.8 V I/O supply rail, when the board describes it

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@38 {
            compatible = "focaltech,ft3418";
            reg = <0x38>;
            interrupt-parent = <&pio>;
            interrupts = <1 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&pio 2 GPIO_ACTIVE_LOW>;
            vdd-supply = <&vtouch>;
            touchscreen-size-x = <1080>;
            touchscreen-size-y = <2400>;
        };
    };
...
