%YAML 1.2
---
$id: http://devicetree.org/schemas/gnss/mediatek,mt6785-stpgps.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6785 GNSS bridge over the CONNSYS STP transport

maintainers:
  - The poco-m5s port <worker@poco.local>

description: |
  The MT6631 GNSS engine is a task on the CONNSYS MCU. Its data arrives as STP
  frames of type 2 over the BTIF transport, so this node has no register window
  of its own; the driver creates /dev/stpgps for the data path and /dev/gps_emi
  as the EMI-window placeholder the vendor userspace daemon expects.

properties:
  compatible:
    const: mediatek,mt6785-stpgps

required:
  - compatible

additionalProperties: false

examples:
  - |
    gnss {
        compatible = "mediatek,mt6785-stpgps";
    };
